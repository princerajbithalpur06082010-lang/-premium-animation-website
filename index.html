<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEONVERSE — Enter the Extraordinary</title>
<style>
  :root {
    --cyan: #00e5ff;
    --purple: #a855f7;
    --pink: #ff2ec4;
    --orange: #ff8a00;
    --bg: #05010f;
    --text: #e8e6ff;
    --muted: #a09cc4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(10, 5, 25, 0.5); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--cyan), var(--purple), var(--pink));
    border-radius: 10px;
  }

  /* Cursor glow (desktop only) */
  .cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,85,247,0.15), transparent 70%);
    pointer-events: none;
    z-index: 150;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    mix-blend-mode: screen;
  }
  @media (hover: none) { .cursor-glow { display: none; } }

  /* STAGE */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    transform: translateX(100%);
    transition: transform 0.85s cubic-bezier(0.77, 0, 0.18, 1);
    will-change: transform;
    scrollbar-width: thin;
  }
  .slide.active { transform: translateX(0); }
  .slide.left   { transform: translateX(-100%); }
  .slide.right  { transform: translateX(100%); }

  .slide-bg {
    position: absolute;
    inset: 0;
    z-index: -3;
    animation: bgShift 18s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { transform: scale(1) translate(0,0); }
    100% { transform: scale(1.15) translate(-2%, 2%); }
  }
  .slide-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }

  /* Film grain */
  .grain {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.1;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grainShift 0.6s steps(4) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-2%, 1%); }
    50%  { transform: translate(1%, -1%); }
    75%  { transform: translate(-1%, 2%); }
    100% { transform: translate(0,0); }
  }

  /* Floating blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    pointer-events: none;
    z-index: -2;
    animation: blobFloat 20s ease-in-out infinite;
  }
  .blob-1 { width: 300px; height: 300px; background: var(--cyan); top: 10%; left: -10%; animation-delay: 0s; }
  .blob-2 { width: 400px; height: 400px; background: var(--purple); bottom: -10%; right: -10%; animation-delay: 5s; }
  .blob-3 { width: 250px; height: 250px; background: var(--pink); top: 50%; left: 40%; animation-delay: 10s; }
  @keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.15); }
    66% { transform: translate(-30px, 40px) scale(0.9); }
  }

  /* Per-slide background moods */
  #slide-home .slide-bg {
    background:
      radial-gradient(circle at 20% 20%, rgba(0,229,255,0.18), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(168,85,247,0.20), transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(255,46,196,0.16), transparent 50%),
      #05010f;
  }
  #slide-features .slide-bg {
    background:
      radial-gradient(circle at 20% 20%, rgba(0,229,255,0.15), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0,255,180,0.18), transparent 50%),
      radial-gradient(circle at 50% 10%, rgba(168,85,247,0.20), transparent 50%),
      #030a14;
  }
  #slide-experience .slide-bg {
    background:
      radial-gradient(circle at 20% 30%, rgba(255,46,196,0.20), transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,138,0,0.18), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(168,85,247,0.22), transparent 55%),
      #0a0110;
  }

  /* NAVBAR */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 6vw;
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    background: rgba(5, 1, 15, 0.55);
    border-bottom: 1px solid rgba(168, 85, 247, 0.2);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  }
  .logo {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink), var(--cyan));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: pointer;
    user-select: none;
    animation: logoGlow 4s ease infinite;
    transition: filter 0.3s;
  }
  .logo:hover { filter: drop-shadow(0 0 12px var(--cyan)); }
  @keyframes logoGlow {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .nav-links { display: flex; gap: 24px; list-style: none; }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.92rem;
    transition: color 0.3s;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    left: 0; bottom: -4px;
    width: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    transition: width 0.35s ease;
    box-shadow: 0 0 8px var(--cyan);
  }
  .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
  .nav-links a:hover, .nav-links a.active { color: var(--cyan); }
  .nav-cta {
    padding: 8px 18px;
    border-radius: 30px;
    border: 1px solid rgba(168, 85, 247, 0.6);
    background: rgba(168, 85, 247, 0.08);
    color: var(--text);
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.35s;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .nav-cta:hover {
    background: var(--purple);
    box-shadow: 0 0 25px var(--purple), 0 0 50px rgba(168,85,247,0.4);
    border-color: var(--purple);
  }

  /* CONTENT */
  .content {
    padding: 100px 6vw 60px;
    min-height: 100%;
    position: relative;
    z-index: 1;
  }

  /* HERO */
  .hero {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    align-items: center;
    gap: 40px;
    padding: 40px 0;
    min-height: calc(100vh - 160px);
  }
  .hero-text h1 {
    font-size: clamp(1.9rem, 5.2vw, 3.6rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.5px;
    text-shadow: 0 4px 30px rgba(168,85,247,0.3);
  }
  .gradient-text {
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink), var(--orange), var(--cyan));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradMove 5s ease infinite;
    filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
  }
  @keyframes gradMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .hero-text p {
    color: var(--muted);
    margin: 22px 0 30px;
    font-size: 1.02rem;
    max-width: 520px;
    line-height: 1.75;
  }
  .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }

  /* BUTTONS */
  .btn {
    padding: 14px 26px;
    border-radius: 40px;
    font-size: 0.94rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1.2), box-shadow 0.35s;
    text-decoration: none;
    display: inline-block;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    will-change: transform;
    letter-spacing: 0.3px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: #05010f;
    box-shadow: 0 6px 20px rgba(0, 229, 255, 0.25);
  }
  .btn-primary:hover {
    box-shadow: 0 0 30px rgba(0,229,255,0.7), 0 0 60px rgba(168,85,247,0.4);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.03);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    border-color: var(--pink);
    box-shadow: 0 0 25px rgba(255,46,196,0.5);
    background: rgba(255, 46, 196, 0.08);
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0);
    animation: rippleGo 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleGo {
    to { transform: scale(4); opacity: 0; }
  }

  /* HERO VISUAL */
  .hero-visual {
    position: relative;
    height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: orbFloat 6s ease-in-out infinite;
  }
  @keyframes orbFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .orb {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, #ffffff 0%, #c4f4ff 8%, var(--cyan) 25%, var(--purple) 55%, var(--pink) 80%, transparent 100%);
    box-shadow:
      0 0 40px var(--cyan),
      0 0 80px var(--purple),
      0 0 140px rgba(255,46,196,0.4),
      inset -10px -10px 40px rgba(0,0,0,0.5),
      inset 10px 10px 40px rgba(255,255,255,0.15);
    animation: orbPulse 4s ease-in-out infinite;
    z-index: 2;
  }
  .orb::before {
    content: '';
    position: absolute;
    top: 15%; left: 20%;
    width: 30%; height: 22%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent 70%);
    filter: blur(4px);
    pointer-events: none;
  }
  .orb::after {
    content: '';
    position: absolute;
    top: 55%; left: 30%;
    width: 40%; height: 15%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
    filter: blur(6px);
  }
  @keyframes orbPulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  .orb-trail {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--cyan), transparent, var(--pink), transparent);
    animation: spin 5s linear infinite;
    filter: blur(18px);
    opacity: 0.75;
    z-index: 1;
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid transparent;
    background: conic-gradient(from 0deg, var(--cyan), transparent, var(--pink), transparent, var(--cyan)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 8s linear infinite;
  }
  .ring-1 { width: 270px; height: 270px; opacity: 0.7; }
  .ring-2 { width: 330px; height: 330px; animation-duration: 12s; animation-direction: reverse; opacity: 0.5; }
  .ring-3 { width: 390px; height: 390px; animation-duration: 16s; opacity: 0.35; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .float-card {
    position: absolute;
    padding: 9px 14px;
    border-radius: 14px;
    background: rgba(20, 10, 40, 0.75);
    border: 1px solid rgba(168, 85, 247, 0.35);
    backdrop-filter: blur(8px);
    font-size: 0.78rem;
    color: var(--text);
    animation: floatY 5s ease-in-out infinite;
    white-space: nowrap;
    z-index: 3;
  }
  .fc1 { top: 12%; left: 0; }
  .fc2 { bottom: 14%; right: 0; animation-delay: 1.5s; }
  .fc3 { top: 42%; right: -4%; animation-delay: 3s; }
  @keyframes floatY {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: particleFloat 6s ease-in-out infinite;
  }
  @keyframes particleFloat {
    0%,100% { transform: translate(0,0); opacity: 0.4; }
    50% { transform: translate(10px,-20px); opacity: 1; }
  }

  /* MARQUEE */
  .marquee {
    overflow: hidden;
    padding: 16px 0;
    margin-top: 40px;
    border-top: 1px solid rgba(168,85,247,0.15);
    border-bottom: 1px solid rgba(168,85,247,0.15);
    background: rgba(10, 4, 25, 0.5);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .marquee-track {
    display: flex;
    gap: 50px;
    white-space: nowrap;
    animation: scrollX 25s linear infinite;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 0.9rem;
    color: var(--muted);
    text-transform: uppercase;
    width: max-content;
  }
  .marquee-track span { color: var(--cyan); }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  @keyframes scrollX {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* SECTION */
  .section-title {
    font-size: clamp(1.5rem, 3.5vw, 2.3rem);
    font-weight: 800;
    margin-bottom: 14px;
    text-align: center;
  }
  .section-sub {
    color: var(--muted);
    text-align: center;
    max-width: 600px;
    margin: 0 auto 44px;
  }

  /* FEATURES CARDS */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 24px;
    perspective: 1200px;
  }
  .card {
    padding: 32px 26px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(20, 10, 40, 0.7), rgba(10, 5, 25, 0.5));
    border: 1px solid rgba(168, 85, 247, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s ease, box-shadow 0.4s, border-color 0.4s;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(168,85,247,0.35), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(135deg, var(--cyan), transparent 40%, transparent 60%, var(--pink));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card:hover {
    border-color: transparent;
    box-shadow: 0 25px 60px rgba(0,229,255,0.22), 0 0 40px rgba(168,85,247,0.25);
  }
  .card:hover::before, .card:hover::after { opacity: 1; }
  .card-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 1.5rem;
    margin-bottom: 18px;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: #05010f;
    font-weight: 800;
    transition: transform 0.4s;
    box-shadow: 0 6px 20px rgba(0, 229, 255, 0.3);
  }
  .card:hover .card-icon { transform: translateZ(30px) scale(1.1); }
  .card h3 { font-size: 1.18rem; margin-bottom: 10px; transition: transform 0.4s; }
  .card p { color: var(--muted); font-size: 0.92rem; transition: transform 0.4s; }
  .card:hover h3, .card:hover p { transform: translateZ(20px); }

  /* SHOWCASE */
  .showcase {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 44px;
    align-items: center;
    margin-bottom: 60px;
  }
  .showcase-visual {
    position: relative;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 800px;
  }
  .showcase-center {
    width: 110px; height: 110px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
    box-shadow: 0 0 50px rgba(168,85,247,0.6), 0 0 100px rgba(0,229,255,0.35);
    animation: cubeRotate 10s ease-in-out infinite;
    transform-style: preserve-3d;
  }
  @keyframes cubeRotate {
    0%   { transform: rotateX(0) rotateY(0); }
    50%  { transform: rotateX(20deg) rotateY(180deg); }
    100% { transform: rotateX(0) rotateY(360deg); }
  }
  .showcase-visual .ring { position: absolute; }
  .showcase h2 {
    font-size: clamp(1.5rem, 3.5vw, 2.3rem);
    font-weight: 800;
    margin-bottom: 16px;
  }
  .showcase p { color: var(--muted); margin-bottom: 24px; line-height: 1.75; }

  /* CTA */
  .cta-final {
    text-align: center;
    padding: 60px 0 30px;
  }
  .cta-final h2 {
    font-size: clamp(1.7rem, 4vw, 2.8rem);
    font-weight: 900;
    margin-bottom: 16px;
  }
  .cta-final p { color: var(--muted); margin-bottom: 30px; }

  /* FOOTER */
  footer {
    padding: 30px 6vw 25px;
    border-top: 1px solid rgba(168,85,247,0.15);
    text-align: center;
    margin-top: 40px;
    position: relative;
  }
  footer::before {
    content: '';
    position: absolute;
    top: -1px; left: 50%;
    transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  }
  footer .logo { font-size: 1.1rem; }
  footer p { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }

  /* REVEAL */
  .reveal {
    opacity: 0;
    transform: translateY(40px) scale(0.97);
    transition: opacity 0.85s cubic-bezier(0.2, 0.8, 0.3, 1.2), transform 0.85s cubic-bezier(0.2, 0.8, 0.3, 1.2);
  }
  .slide.active .reveal.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .parallax-slow { will-change: transform; }

  /* RESPONSIVE */
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; text-align: center; }
    .hero-text p { margin-left: auto; margin-right: auto; }
    .hero-btns { justify-content: center; }
    .hero-visual { height: 320px; margin-top: 30px; }
    .ring-3 { width: 300px; height: 300px; }
    .ring-2 { width: 250px; height: 250px; }
    .ring-1 { width: 200px; height: 200px; }
    .orb { width: 150px; height: 150px; }
    .showcase { grid-template-columns: 1fr; }
    .nav-links { display: none; }
    .fc3 { right: 0; }
    .content { padding: 90px 5vw 50px; }
  }
</style>
</head>
<body>

<!-- Cursor glow (desktop) -->
<div class="cursor-glow" id="cursorGlow"></div>

<!-- NAVBAR -->
<nav>
  <div class="logo" data-nav="home">NEONVERSE</div>
  <ul class="nav-links">
    <li><a data-nav="home" class="active">Home</a></li>
    <li><a data-nav="features">Features</a></li>
    <li><a data-nav="experience">Experience</a></li>
  </ul>
  <button class="nav-cta" data-nav="features">Discover</button>
</nav>

<div class="stage">

  <!-- HOME -->
  <div class="slide active" id="slide-home">
    <div class="slide-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grain"></div>
    <div class="content">
      <header class="hero">
        <div class="hero-text">
          <h1>ENTER THE <span
